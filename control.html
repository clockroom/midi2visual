<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>MIDI Visualizer Control</title>
	</head>
	<body class="control-page">
		<main class="control-shell">
			<header class="control-header">
				<div>
					<p class="eyebrow">MIDI2VISUAL</p>
					<h1>Visualizer Control</h1>
					<p>変更は同一オリジンで開いている映像画面へ即時反映されます。</p>
				</div>
				<a class="stage-link" href="/" target="_blank" rel="noreferrer">映像画面を開く</a>
			</header>

			<form id="settings-form" class="settings-grid">
				<section class="settings-card">
					<h2>ファイル</h2>
					<div id="file-settings" class="field-list"></div>
					<div class="file-actions">
						<button id="reload-midi" type="button">MIDIを再読み込み</button>
					</div>
				</section>
				<section class="settings-card">
					<h2>レベルメータ</h2>
					<div id="level-meter-settings" class="field-list"></div>
				</section>
				<section class="settings-card">
					<h2>ノート</h2>
					<div id="note-settings" class="field-list"></div>
				</section>
				<section class="settings-card">
					<h2>ロングトーン</h2>
					<div id="long-note-settings" class="field-list"></div>
				</section>
				<section class="settings-card">
					<h2>組み込みエフェクト</h2>
					<div id="built-in-effect-settings" class="field-list"></div>
				</section>
				<section class="settings-card">
					<h2>カスタムエフェクト</h2>
					<div id="custom-effect-settings" class="field-list"></div>
				</section>
				<details class="advanced-settings">
					<summary>詳細設定</summary>
					<div class="advanced-settings-grid">
						<section class="settings-card">
							<h2>再生と時間</h2>
							<div id="time-settings" class="field-list"></div>
						</section>
						<section class="settings-card">
							<h2>ガイド</h2>
							<div id="guide-settings" class="field-list"></div>
						</section>
						<section class="settings-card settings-card-wide">
							<h2>空間・カメラ・背景</h2>
							<div id="space-settings" class="field-list"></div>
						</section>
					</div>
				</details>
			</form>

			<footer class="control-actions">
				<button id="reset-settings" class="secondary" type="button">初期設定へ戻す</button>
				<span id="save-status" role="status">保存済み</span>
			</footer>
		</main>
		<script type="module" src="/src/control/main.ts"></script>
	</body>
</html>
